# Apache include for the HTTPS virtual host (cPanel "userdata" include).
# Forwards the domain to the SyncPads Node server on 127.0.0.1:3000.
# Installed by deploy/cpanel/setup.sh.

ProxyPreserveHost On
ProxyRequests Off

# Drop any X-Forwarded-For the visitor sent; mod_proxy then adds the real
# client IP as the only entry. The sign-in lockout relies on this.
RequestHeader unset X-Forwarded-For
RequestHeader set X-Forwarded-Proto "https"

# Let cPanel AutoSSL verify the domain.
ProxyPass /.well-known/ !

ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
