# Apache include for the plain HTTP virtual host (cPanel "userdata" include).
# Sends everything to HTTPS, except the paths AutoSSL needs to verify the domain.
# Installed by deploy/cpanel/setup.sh.

RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
