# Production stack for one Ubuntu server (no Coolify).
#
#   Caddy (HTTPS, ports 80/443) -> app (Next.js, port 3000) -> MariaDB 11.8 + Redis
#
# On the server, from the repo folder:
#   cp .env.production.example .env   # fill it in
#   ./scripts/deploy.sh               # build and start everything
#
# Only Caddy is reachable from the internet. MariaDB and Redis have no public ports.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # HTTPS certificates
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    environment:
      BETTER_AUTH_URL: https://${APP_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DATABASE_URL: mysql://syncpads:${DB_PASSWORD}@mariadb:3306/syncpads
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      TRUST_PROXY: "true" # Caddy sets X-Forwarded-For
      RUN_MIGRATIONS_ON_START: "true"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: syncpads
      MARIADB_USER: syncpads
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy-data:
  caddy-config:
  mariadb-data:
  redis-data:
